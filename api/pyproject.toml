[project]
name = "metrix-api"
version = "0.0.0"
description = "Metrix control plane: discovery, observation, storage, and UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "boto3>=1.35",
    "asyncssh>=2.19",
    "httpx>=0.28",
]

[project.scripts]
metrix-api = "metrix_api.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrix_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
