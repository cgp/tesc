[project]
name = "metrix-api"
version = "0.0.0"
description = "Metrix control plane: discovery, observation, storage, and UI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.10",
    "jsonschema>=4.23",
    "boto3>=1.35",
    "asyncssh>=2.19",
    "httpx>=0.28",
]

[project.scripts]
metrix-api = "metrix_api.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/metrix_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/metrix_api/store/migrations" = "metrix_api/store/migrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real host; skipped unless tests/integration.toml exists",
]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Beyond the defaults: E501 so line-length above is enforced rather than decorative,
# plus import order, modern syntax, and the bug-prone patterns bugbear catches.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Captured /proc text, reproduced verbatim. Wrapping a fixture line would make it
# stop being a fixture.
"tests/test_observer_linux.py" = ["E501"]
