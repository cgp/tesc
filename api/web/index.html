<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Metrix</title>
<!--
  One static page. Tabler for the shell, our own CSS for density, ES modules for
  behaviour. No build step and no framework: everything here is loaded as written.

  Nothing on this page reaches the network. Tabler is vendored under /vendor/tabler,
  uPlot under /vendor/uplot, and the icons are inline Tabler Icons rather than a font
  or a sprite sheet, which is also why the menu has no blank frame before the modules
  load. A tool that observes a private network must not need the public one to draw
  itself.
-->
<link rel="stylesheet" href="/vendor/tabler/tabler.min.css">
<link rel="stylesheet" href="/vendor/uplot/uPlot.min.css">
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="page">
  <aside class="navbar navbar-vertical navbar-expand-sm">
    <div class="container-fluid">
      <h1 class="navbar-brand">
        <svg class="brand-mark" viewBox="0 0 32 32" width="32" height="32" aria-hidden="true">
          <rect class="brand-mark-field" width="32" height="32" rx="8"/>
          <path class="brand-mark-trace" d="M6 20h3.2l2.4-8.2 3.2 11.4 2.8-9.2 1.8 6H26"/>
        </svg>
        <span>Metrix</span>
      </h1>

      <div class="navbar-collapse">
        <ul class="navbar-nav" id="nav">
          <li class="nav-heading subheader">Setup</li>
          <li class="nav-item" data-route="config">
            <a class="nav-link" href="#/config">
              <span class="nav-link-icon">
                <!-- tabler: adjustments -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 10a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M6 4v4"/>
                  <path d="M6 12v8"/><path d="M10 16a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/>
                  <path d="M12 4v10"/><path d="M12 18v2"/>
                  <path d="M16 7a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M18 4v1"/>
                  <path d="M18 9v11"/>
                </svg>
              </span>
              <span class="nav-link-title">Config</span>
            </a>
          </li>
          <li class="nav-item" data-route="schemas">
            <a class="nav-link" href="#/schemas">
              <span class="nav-link-icon">
                <!-- tabler: file-database -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14 3v4a1 1 0 0 0 1 1h4"/>
                  <path d="M5 8v-3a2 2 0 0 1 2 -2h7l5 5v4"/>
                  <path d="M5 15a4 2 0 1 0 8 0a4 2 0 0 0 -8 0"/>
                  <path d="M5 15v4a4 2 0 0 0 8 0v-4"/>
                </svg>
              </span>
              <span class="nav-link-title">Schemas</span>
            </a>
          </li>
          <li class="nav-item" data-route="profiles">
            <a class="nav-link" href="#/profiles">
              <span class="nav-link-icon">
                <!-- tabler: server -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 7a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/>
                  <path d="M3 15a3 3 0 0 1 3 -3h12a3 3 0 0 1 3 3a3 3 0 0 1 -3 3h-12a3 3 0 0 1 -3 -3z"/>
                  <path d="M7 8l0 .01"/><path d="M7 16l0 .01"/>
                </svg>
              </span>
              <span class="nav-link-title">Profiles</span>
            </a>
          </li>

          <li class="nav-item" data-route="plans">
            <a class="nav-link" href="#/plans">
              <span class="nav-link-icon">
                <!-- tabler: list-check -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3.5 5.5l1.5 1.5l2.5 -2.5"/><path d="M3.5 11.5l1.5 1.5l2.5 -2.5"/>
                  <path d="M3.5 17.5l1.5 1.5l2.5 -2.5"/><path d="M11 6l9 0"/>
                  <path d="M11 12l9 0"/><path d="M11 18l9 0"/>
                </svg>
              </span>
              <span class="nav-link-title">Plans</span>
            </a>
          </li>

          <li class="nav-heading subheader">Performance</li>
          <li class="nav-item" data-route="stats">
            <a class="nav-link" href="#/performance/stats">
              <span class="nav-link-icon">
                <!-- tabler: table -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 5a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/>
                  <path d="M3 10h18"/><path d="M10 3v18"/>

              </span>
              <span class="nav-link-title">Stats</span>
            </a>
          </li>
          <li class="nav-item" data-route="charts">
            <a class="nav-link" href="#/performance/charts">
              <span class="nav-link-icon">
                <!-- tabler: chart-line -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M4 19l16 0"/><path d="M4 15l4 -6l4 2l4 -5l4 4"/>
                </svg>
              </span>
              <span class="nav-link-title">Charts</span>
            </a>
          </li>

          <li class="nav-heading subheader">Archive</li>
          <li class="nav-item" data-route="recordings">
            <a class="nav-link" href="#/recordings">
              <span class="nav-link-icon">
                <!-- tabler: archive -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 6a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2z"/>
                  <path d="M5 8v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-10"/><path d="M10 12h4"/>
                </svg>
              </span>
              <span class="nav-link-title">Recordings</span>
            </a>
          </li>
          <li class="nav-item" data-route="series">
            <a class="nav-link" href="#/series">
              <span class="nav-link-icon">
                <!-- tabler: trending-up -->
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3 17l6 -6l4 4l8 -8"/><path d="M14 7l7 0l0 7"/>
                </svg>
              </span>
              <span class="nav-link-title">Series</span>
            </a>
          </li>
        </ul>

        <div class="nav-footer">
          <span class="status status-secondary" id="health">
            <span class="status-dot"></span>
            <span id="health-text">connecting…</span>
          </span>
        </div>
      </div>
    </div>
  </aside>

  <div class="page-wrapper">
    <div class="page-header">
      <div class="container-fluid">
        <div class="page-pretitle" id="page-pretitle"></div>
        <div class="page-title-row">
          <h2 class="page-title" id="page-title">Metrix</h2>
          <!-- Shown only on pages that have written an explanation. A help button
               that opens an empty dialog is worse than no help button. -->
          <button type="button" class="btn btn-icon btn-ghost-secondary metrix-help-open"
                  id="help-open" hidden aria-haspopup="dialog"
                  aria-label="What this page is for" title="What this page is for">
            <!-- tabler: help-circle -->
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0"/>
              <path d="M12 16v.01"/>
              <path d="M12 13a2 2 0 0 0 .914 -3.782a1.98 1.98 0 0 0 -2.414 .483"/>
            </svg>
          </button>
        </div>
        <div class="page-lede text-secondary" id="page-subtitle"></div>
      </div>
    </div>
    <div class="page-body">
      <div class="container-fluid">
        <div id="error" role="alert" aria-live="polite"></div>
        <div id="view" aria-live="polite"></div>
      </div>
    </div>
  </div>
</div>

<!--
  The page explanation. A native <dialog> rather than Bootstrap's modal: it gives
  Escape, the focus trap and the inert background for nothing, and it is one element
  instead of three nested ones. Dismissing by clicking outside is the only part that
  needs script, because a click on the backdrop targets the dialog itself.
-->
<dialog id="help" class="metrix-help" aria-labelledby="help-title">
  <div class="metrix-help-head">
    <h3 class="metrix-help-title" id="help-title"></h3>
    <button type="button" class="btn-close" data-action="help-close"
            aria-label="Close"></button>
  </div>
  <div class="metrix-help-body" id="help-body"></div>
</dialog>

<!--
  Tabler's own JS (Bootstrap's components, bundled). Deferred and vendored so the
  dropdowns and tooltips its markup assumes work without a network round trip.
-->
<script src="/vendor/tabler/tabler.min.js" defer></script>
<!--
  uPlot. Not deferred: the charts module reads `window.uPlot` when it first draws, and
  a module that has to wait for a script to arrive is a module that has to grow a
  ready-check. Both files are small and local.
-->
<script src="/vendor/uplot/uPlot.iife.min.js"></script>
<script type="module" src="/js/main.js"></script>
</body>
</html>
