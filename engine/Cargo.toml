[workspace]
resolver = "3"
members = [
    "crates/metrix-plan",
    "crates/metrix-metrics",
    "crates/metrix-gen",
    "crates/metrix-mock",
    "crates/metrix-engine",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
