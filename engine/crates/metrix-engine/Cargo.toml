[package]
name = "metrix-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The binary: runtime, scheduler, HTTP, target loop."

[dependencies]
metrix-plan = { path = "../metrix-plan" }
metrix-metrics = { path = "../metrix-metrics" }
schemars = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
bytes = "1"
atomic-waker = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sha2 = "0.10"
clap = { version = "4.5", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
num_cpus = "1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
webpki-roots = "1"
serde_json_path = "0.7.2"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"
regex = "1.13.1"

[dev-dependencies]
metrix-mock = { path = "../metrix-mock" }
tempfile = "3"
tokio = { version = "1", features = ["test-util", "io-util", "process"] }
hyper-util = { version = "0.1", features = ["server-auto"] }

[lints]
workspace = true
